input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  # 입력 구분값은 Elasticsearch에 저장하지 않고 Logstash 내부에서만 사용합니다.
  if "aul" in [tags] {
    mutate { add_field => { "[@metadata][stream]" => "aul" } }
  } else if "fsevents" in [tags] {
    mutate { add_field => { "[@metadata][stream]" => "fsevents" } }
  }

  if [host][name] {
    mutate {
      lowercase => [ "[host][name]" ]
    }
  }

  # 2. host.hostname 필드 소문자 변환 (AUL 로그에 자주 등장)
  if [host][hostname] {
    mutate {
      lowercase => [ "[host][hostname]" ]
    }
  }

  # 3. agent.name 필드 소문자 변환 (Filebeat 에이전트 이름)
  if [agent][name] {
    mutate {
      lowercase => [ "[agent][name]" ]
    }
  }

  # 4. (안전장치) host.name이 비어있으면 agent.name을 복사해서 소문자로 채움
  if ![host][name] and [agent][name] {
    mutate {
      add_field => { "[host][name]" => "%{[agent][name]}" }
    }
    mutate {
      lowercase => [ "[host][name]" ]
    }
  }
  if "aul" in [tags] {  
    json {
      source => "message"
      target => "aul"
    }

    date {
      match => [ 
        "[aul][timestamp]", 
        "yyyy-MM-dd HH:mm:ss.SSSSSSZ", 
        "ISO8601" 
      ]
    
      target => "@timestamp"
    }

    mutate {
      remove_field => ["message"]
    }

    # @timestamp 변환에 성공한 경우에만 중복된 Apple 원본 시간 필드를 제거합니다.
    if "_dateparsefailure" not in [tags] {
      mutate {
        remove_field => ["[aul][timestamp]"]
      }
    }

    # 값이 없는 Apple 메타데이터는 저장하지 않습니다.
    if [aul][bootUUID] == "" {
      mutate {
        remove_field => ["[aul][bootUUID]"]
      }
    }
    if [aul][timezoneName] == "" {
      mutate {
        remove_field => ["[aul][timezoneName]"]
      }
    }
  }

  else if "fsevents" in [tags] {
    json {
      source => "message"
      target => "fsevents"
    }
    
    if [fsevents][@timestamp] {
      date {
        match => [ "[fsevents][@timestamp]", "ISO8601" ]
        target => "@timestamp"
      }
    }

    
    mutate {
      remove_field => ["message"]
    }
  }

  # Logstash 내부 호환성 필드는 탐지와 분석에 사용하지 않습니다.
  mutate {
    remove_field => [
      "@version",
      "[event]",
      "[ecs]",
      "[input]",
      "[tags]",
      "[host][ip]",
      "[host][mac]",
      "[host][os][build]",
      "[host][os][version]",
      "[host][os][platform]",
      "[host][os][family]",
      "[host][os][type]",
      "[host][os][kernel]",
      "[host][architecture]",
      "[host][id]",
      "[agent][ephemeral_id]",
      "[agent][version]",
      "[agent][id]",
      "[agent][type]",
      "[log]"
    ]
  }

  if [@metadata][stream] == "aul" {
    mutate {
      remove_field => [
        "[aul][source]",
        "[aul][userID]",
        "[aul][category]",
        "[aul][threadID]",
        "[aul][senderImageUUID]",
        "[aul][eventType]",
        "[aul][senderImagePath]",
        "[aul][backtrace]",
        "[aul][activityIdentifier]",
        "[aul][processID]",
        "[aul][processImageUUID]",
        "[aul][machTimestamp]",
        "[aul][senderProgramCounter]",
        "[aul][parentActivityIdentifier]"
      ]
    }
  } else if [@metadata][stream] == "fsevents" {
    mutate {
      remove_field => [
        "[fsevents][file][name]",
        "[fsevents][file][directory]",
        "[fsevents][ransomware][analysis_result]",
        "[fsevents][ransomware][suspicious]",
        "[fsevents][ransomware][suspicious_extension]",
        "[fsevents][log]",
        "[fsevents][event]"
      ]
    }
  }
}

output {
  if [@metadata][stream] == "aul" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200/"]
      # 기존 mac-YYYY.MM.dd 인덱스의 traceID(long) 매핑과 충돌하지 않도록
      # unsigned_long 매핑이 적용되는 새 인덱스로 기록합니다.
      index => "mac-%{+YYYY.MM.dd}-v3"
      user => "logstash_internal"
      password => "${LOGSTASH_INTERNAL_PASSWORD}"
      ssl_enabled => false
      # ssl_truststore_path => '/etc/logstash/certs/http.p12'
      # ssl_truststore_password => ""
      # ssl_truststore_type => "pkcs12"
    }
  }  

  else if [@metadata][stream] == "fsevents" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200/"]
      index => "fsevents-%{+YYYY.MM.dd}"
      user => "logstash_internal"
      password => "${LOGSTASH_INTERNAL_PASSWORD}"
      ssl_enabled => false

      # ssl_truststore_path => '/etc/logstash/certs/http.p12'
      # ssl_truststore_password => ""
      # ssl_truststore_type => "pkcs12"
    }
  }  
}
